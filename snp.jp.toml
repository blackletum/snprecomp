# N64Recomp config for Tsumi to Batsu: Hoshi no Keishousha (Japan).
# The fan-translated English ROM runs the same recompiled code (its code
# segments are identical, STATUS.md round 1).

[input]
entrypoint = 0x80025C00
output_func_path = "RecompiledFuncs"
rom_file_path = "Tsumi to Batsu - Hoshi no Keishousha (Japan).z64"
symbols_file_path = "SnPSyms/snp.jp.syms.toml"


[patches]

# --- Code segments ----------------------------------------------------------
# The game's segment loader copies a segment in 0x1000-byte DMAs, too small
# for the runtime to see the code section being loaded. Register it once the
# copy is done (src/game/overlay_loader.cpp, STATUS.md round 2). 0x8003A6F8 is
# right after the copy loop; $s5 holds the load request.
[[patches.hook]]
func = "func_8003A5F0"
before_vram = 0x8003A6F8
text = "snp_segment_loaded(rdram, (int32_t)ctx->r21); // snp: register loaded segment"

# --- Frame display lists --------------------------------------------------
# Right before each osSpTaskLoad in the game's task threads, with the OSTask
# in $a0: widescreen, HUD anchoring and interpolation IDs
# (src/game/display_list.cpp).
[[patches.hook]]
func = "func_8004E640"
before_vram = 0x8004E73C
text = "snp_display_list_hook(rdram, (int32_t)ctx->r4); // snp: frame display list"

[[patches.hook]]
func = "func_8004E4A0"
before_vram = 0x8004E578
text = "snp_display_list_hook(rdram, (int32_t)ctx->r4); // snp: frame display list"

[[patches.hook]]
func = "func_8004E4A0"
before_vram = 0x8004E5E8
text = "snp_display_list_hook(rdram, (int32_t)ctx->r4); // snp: frame display list"

# --- Audio ----------------------------------------------------------------
# The audio thread sizes each frame from AI_LEN and skips a frame while the
# AI FIFO is full; the runtime's answers don't match the hardware's, so the
# game wrote 25% too much audio (crackle). Replace the results of its
# osAiGetStatus (jal at 0x800520C8) and osAiGetLength (0x800520D4) calls
# (src/main/main.cpp, STATUS.md round 6).
[[patches.hook]]
func = "func_80052064"
before_vram = 0x800520D0
text = "{ extern uint32_t snp_ai_status(void); ctx->r2 = (gpr)(int32_t)snp_ai_status(); } // snp: AI status"

[[patches.hook]]
func = "func_80052064"
before_vram = 0x800520DC
text = "{ extern uint32_t snp_ai_length(void); ctx->r2 = (gpr)(int32_t)snp_ai_length(); } // snp: AI length"

# --- Widescreen: culling at the screen edges ------------------------------
# func_80029070 decides whether an object is in view: its position in camera
# space against near/far, top/bottom and left/right limits from the camera
# (the left/right one is camera+0x4B4 * depth + camera+0x4B8, plus the
# object's radius). In Expand the picture is wider than the 4:3 view those
# limits describe, so scenery at the sides wasn't drawn; the left/right limit
# is scaled by the widescreen scale (src/game/widescreen.cpp).
[[patches.hook]]
func = "func_80029070"
before_vram = 0x8002917C
text = "{ extern float snp_cull_width_scale(void); ctx->f0.fl *= snp_cull_width_scale(); } // snp: widescreen culling"

# --- Interpolation IDs ------------------------------------------------------
# Characters are posed by func_80032F2C, which walks a skeleton: $s2 is the
# character's pose entry for the current joint (0x20 bytes per joint, the same
# address every frame). For each joint it calls func_80032CDC or
# func_80032D94, which build each mesh's matrix in func_80032AA0 (guMtxF2L at
# 0x80032C88: $a1 the new matrix, $s1 the mesh). The matrix is recorded with
# its joint and mesh, and the display list pass tags its load with them
# (src/game/interpolation.cpp, src/game/display_list.cpp).
[[patches.hook]]
func = "func_80032F2C"
before_vram = 0x80033038
text = "{ extern void snp_interp_joint(uint32_t); snp_interp_joint((uint32_t)ctx->r18); } // snp: interpolation"

[[patches.hook]]
func = "func_80032F2C"
before_vram = 0x80033064
text = "{ extern void snp_interp_joint(uint32_t); snp_interp_joint((uint32_t)ctx->r18); } // snp: interpolation"

[[patches.hook]]
func = "func_80032F2C"
before_vram = 0x8003306C
text = "{ extern void snp_interp_joint(uint32_t); snp_interp_joint(0); } // snp: interpolation"

# func_80034054 builds another kind of mesh's matrix (guMtxF2L at
# 0x80034154: $a1 the new matrix, $s0 the mesh); recorded when it's part of a
# joint.
[[patches.hook]]
func = "func_80034054"
before_vram = 0x80034154
text = "{ extern void snp_interp_matrix(uint32_t, uint32_t, uint32_t, uint32_t, uint32_t); snp_interp_matrix((uint32_t)ctx->r5, (uint32_t)ctx->r16, MEM_W(0x30, ctx->r4), MEM_W(0x34, ctx->r4), MEM_W(0x38, ctx->r4)); } // snp: interpolation"

# func_80033758 is the second skeleton walker (animated characters): $s1 the
# joint's pose entry, $s0 its slot in the character's animation channels.
[[patches.hook]]
func = "func_80033758"
before_vram = 0x80033944
text = "{ extern void snp_interp_joint2(uint32_t, uint32_t); snp_interp_joint2((uint32_t)ctx->r17, (uint32_t)ctx->r16); } // snp: interpolation"

[[patches.hook]]
func = "func_80033758"
before_vram = 0x80033970
text = "{ extern void snp_interp_joint2(uint32_t, uint32_t); snp_interp_joint2((uint32_t)ctx->r17, (uint32_t)ctx->r16); } // snp: interpolation"

[[patches.hook]]
func = "func_80033758"
before_vram = 0x80033978
text = "{ extern void snp_interp_joint(uint32_t); snp_interp_joint(0); } // snp: interpolation"

[[patches.hook]]
func = "func_80032AA0"
before_vram = 0x80032C88
text = "{ extern void snp_interp_matrix(uint32_t, uint32_t, uint32_t, uint32_t, uint32_t); snp_interp_matrix((uint32_t)ctx->r5, (uint32_t)ctx->r17, MEM_W(0x30, ctx->r4), MEM_W(0x34, ctx->r4), MEM_W(0x38, ctx->r4)); } // snp: interpolation"

# Where a skeleton starts being drawn (func_80033128 and func_80033170 for
# func_80032F2C, func_80033A40 and func_80033AC4 for func_80033758): enemies
# of a kind in a group can share one pose, so each skeleton drawn is told
# apart as an instance, of the kind its arguments ($a0, $a1: the skeleton and
# its animation) say ($a0 at the matrix hooks above is the float matrix, its
# translation where the instance is).
[[patches.hook]]
func = "func_80033128"
before_vram = 0x80033128
text = "{ extern void snp_interp_instance(uint32_t, uint32_t); snp_interp_instance((uint32_t)ctx->r4, (uint32_t)ctx->r5); } // snp: interpolation"

[[patches.hook]]
func = "func_80033170"
before_vram = 0x80033170
text = "{ extern void snp_interp_instance(uint32_t, uint32_t); snp_interp_instance((uint32_t)ctx->r4, (uint32_t)ctx->r5); } // snp: interpolation"

[[patches.hook]]
func = "func_80033A40"
before_vram = 0x80033A40
text = "{ extern void snp_interp_instance(uint32_t, uint32_t); snp_interp_instance((uint32_t)ctx->r4, (uint32_t)ctx->r5); } // snp: interpolation"

[[patches.hook]]
func = "func_80033AC4"
before_vram = 0x80033AC4
text = "{ extern void snp_interp_instance(uint32_t, uint32_t); snp_interp_instance((uint32_t)ctx->r4, (uint32_t)ctx->r5); } // snp: interpolation"

# Every matrix guMtxF2L builds that the hooks above didn't record (objects
# that aren't skeletons: the city stage's cones) is an object of its own, of
# the kind its caller ($ra) makes ($a0 the float matrix, $a1 the matrix).
[[patches.hook]]
func = "guMtxF2L"
before_vram = 0x80048940
text = "{ extern void snp_interp_object_matrix(uint8_t*, uint32_t, uint32_t, uint32_t); snp_interp_object_matrix(rdram, (uint32_t)ctx->r4, (uint32_t)ctx->r5, (uint32_t)ctx->r31); } // snp: interpolation"

# --- Reticle reach in Expand -----------------------------------------------
# func_800AB924 moves the reticle and keeps its offset from the screen centre
# ($s2 + 0x28, in 320-wide screen units) within -144 .. 144: 16 short of the
# 4:3 picture's edges. In Expand the view is wider, and enemies at the sides
# could be seen but not aimed at: the limits (loaded into $v1, then stored as
# the clamped value) are moved out to 16 short of the wider screen's edges
# (src/game/widescreen.cpp).
[[patches.hook]]
func = "func_800AB924"
before_vram = 0x800ABB74
text = "{ extern uint32_t snp_reticle_limit_bits(int32_t); ctx->r3 = (int32_t)snp_reticle_limit_bits(-1); } // snp: reticle reach"

[[patches.hook]]
func = "func_800AB924"
before_vram = 0x800ABB9C
text = "{ extern uint32_t snp_reticle_limit_bits(int32_t); ctx->r3 = (int32_t)snp_reticle_limit_bits(1); } // snp: reticle reach"

# --- Mouse aiming and analog aim ----------------------------------------------
# Before the reticle's velocity is added to its position ($s2 + 0x28, + 0x2C)
# the mouse can move it (src/main/mouse.cpp).
[[patches.hook]]
func = "func_800AB924"
before_vram = 0x800ABB4C
text = "{ extern void snp_mouse_reticle(uint8_t*, uint32_t); snp_mouse_reticle(rdram, (uint32_t)ctx->r18); } // snp: mouse aim"

# The stick's offsets ($s0, $s1), cut down to steps of 16 (so five speeds each
# way and a dead zone of 16), are taken unstepped with Analog Aim on.
[[patches.hook]]
func = "func_800AB924"
before_vram = 0x800ABA14
text = "{ extern int32_t snp_analog_aim(int32_t, int32_t); ctx->r16 = snp_analog_aim((int32_t)ctx->r16, MEM_B(0x5A86, S32(0X800D << 16))); ctx->r17 = snp_analog_aim((int32_t)ctx->r17, MEM_B(0x5A87, S32(0X800D << 16))); } // snp: analog aim"

# --- Enhancements and cheats -------------------------------------------------
# func_800D42F8 copies the progress block into the save buffer before the game
# saves: the real clear records go back in while the OPT. menu is unlocked
# (src/game/extras.cpp).
[[patches.hook]]
func = "func_800D42F8"
before_vram = 0x800D431C
text = "snp_extras_saving(rdram); // snp: unlocks don't change the save"

# --- Busy-wait loops ------------------------------------------------------
# These loops poll a flag with no OS call, which never lets the runtime run
# another thread or deliver events. Yield on each pass
# (src/game/spin_wait.cpp, STATUS.md round 2). Each before_vram is the loop
# head, the target of the loop's branch. tools/find_spin_loops.py finds them.

# The idle thread, waiting for a callback in D_800657B0.
[[patches.hook]]
func = "func_80025CA4"
before_vram = 0x80025D30
text = "snp_spin_yield(rdram); // snp: busy-wait yield"

# The main thread, waiting on D_80068A95.
[[patches.hook]]
func = "func_80025E44"
before_vram = 0x80025FB0
text = "snp_spin_yield(rdram); // snp: busy-wait yield"

# Waiting for the job thread (func_8004D7C8) to finish: D_8007AB94 counts
# its pending jobs.
[[patches.hook]]
func = "func_8004D7B0"
before_vram = 0x8004D7B0
text = "snp_spin_yield(rdram); // snp: busy-wait yield"

# --- Other ROMs: translations ------------------------------------------------
# Translations change only a few constants that point at data they moved
# (STATUS.md round 1). Every ROM runs this one recompiled build, so these hooks
# replace the value the Japanese instructions built with what the loaded ROM's
# own instructions there build (src/game/rom_version.cpp).

# func_8002BCE0: a display list address (0x802B5D20 in the Japanese release).
[[patches.hook]]
func = "func_8002BCE0"
before_vram = 0x8002BD60
text = "ctx->r2 = (gpr)(int32_t)snp_rom_value(rdram, (uint32_t)ctx->r2, 0, 0, 0x8002BD5C, 0x24425D20); // snp: ROM constant"

[[patches.hook]]
func = "func_8002BCE0"
before_vram = 0x8002BD90
text = "ctx->r2 = (gpr)(int32_t)snp_rom_value(rdram, (uint32_t)ctx->r2, 0, 0, 0x8002BD8C, 0x24425D20); // snp: ROM constant"

[[patches.hook]]
func = "func_8002BCE0"
before_vram = 0x8002BD9C
text = "ctx->r2 = (gpr)(int32_t)snp_rom_value(rdram, (uint32_t)ctx->r2, 0, 0, 0x8002BD98, 0x24425D20); // snp: ROM constant"

# func_8003C0D0: the ROM offset of the last asset file (0x00A8CA40 in the Japanese release).
[[patches.hook]]
func = "func_8003C0D0"
before_vram = 0x8003C160
text = "ctx->r3 = snp_rom_value(rdram, (uint32_t)ctx->r3, 0x8003C158, 0x3C0200A9, 0x8003C15C, 0x2443CA40); // snp: ROM constant"

[[patches.hook]]
func = "func_8003C0D0"
before_vram = 0x8003C1A0
text = "ctx->r2 = snp_rom_value(rdram, (uint32_t)ctx->r2, 0x8003C198, 0x3C0200A9, 0x8003C19C, 0x2442CA40); // snp: ROM constant"

[[patches.hook]]
func = "func_8003C0D0"
before_vram = 0x8003C1F4
text = "ctx->r3 = snp_rom_value(rdram, (uint32_t)ctx->r3, 0x8003C1EC, 0x3C0200A9, 0x8003C1F0, 0x2443CA40); // snp: ROM constant"
